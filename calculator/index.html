<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculators · DWS Planner</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/_next/static/css/203636aecdefe762.css">
<link rel="stylesheet" href="/calculator/shell.css">
</head>
<body class="bg-dark-bg text-theme-text">
<header class="glass border-b border-dark-border sticky top-0 z-50">
  <div class="max-w-3xl mx-auto px-4 h-16 flex items-center gap-2">
    <a href="/planner/" class="flex items-center gap-2 group shrink-0" aria-label="Back to DWS Planner">
      <span class="w-9 h-9 rounded-lg bg-accent/20 flex items-center justify-center group-hover:bg-accent/30 transition-colors">
        <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </span>
      <span class="text-lg font-bold text-gradient">DWS Planner</span>
    </a>
  </div>
</header>
<main class="max-w-3xl mx-auto px-4 py-6">
  <h1 id="hubTitle" class="text-2xl sm:text-3xl font-bold mb-6"></h1>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <a href="/calculator/precision-parts/" class="glass-card block hover:glow-gold transition" data-slug="precision-parts">
      <div class="font-semibold" data-label>Precision Parts</div>
    </a>
    <a href="/calculator/vehicle-level/" class="glass-card block hover:glow-gold transition" data-slug="vehicle-level">

    <a href="/calculator/vehicle-parts/" class="glass-card block hover:glow-gold transition" data-slug="vehicle-parts">

    <a href="/calculator/hero-weapon/" class="glass-card block hover:glow-gold transition" data-slug="hero-weapon">

    <a href="/calculator/hero-equipment/" class="glass-card block hover:glow-gold transition" data-slug="hero-equipment">
      <div class="font-semibold" data-label>Hero Equipment</div>
    </a>
    <a href="/calculator/vehicle-chips/" class="glass-card block hover:glow-gold transition" data-slug="vehicle-chips">
      <div class="font-semibold" data-label>Vehicle Chips</div>
    </a>

<script src="/calculator/hub.js"></script>
