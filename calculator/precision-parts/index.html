<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precision Parts Calculator · DWS Planner</title>
<meta name="description" content="Work out exactly how many Precision Parts you need to raise your industrial buildings between industry levels.">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/_next/static/css/203636aecdefe762.css">
<style>
.glass-card{background:rgba(39,39,42,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--color-border);border-radius:.75rem;padding:1rem}
select,input{color-scheme:dark}
.row-enter{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.max-w-3xl{max-width:48rem}
.shrink-0{flex-shrink:0}
.items-end{align-items:flex-end}
.items-baseline{align-items:baseline}
.bottom-0{bottom:0}
.inset-x-0{left:0;right:0}
.pb-40{padding-bottom:10rem}
.mt-8{margin-top:2rem}
.-mt-2{margin-top:-.5rem}
.w-11{width:2.75rem}
.h-11{height:2.75rem}
.border-collapse{border-collapse:collapse}
.border-t-2{border-top-width:2px}
.text-start{text-align:start}
.text-end{text-align:end}
.text-right{text-align:right}
.pe-3{padding-inline-end:.75rem}
.hover\:opacity-90:hover{opacity:.9}
.sm\:inline{display:none}
@media(min-width:640px){.sm\:inline{display:inline}.sm\:text-3xl{font-size:1.875rem;line-height:2.25rem}}
.bg-accent\/20{background-color:color-mix(in srgb,var(--color-accent) 20%,transparent)}
.group:hover .group-hover\:bg-accent\/30{background-color:color-mix(in srgb,var(--color-accent) 30%,transparent)}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
[hidden]{display:none!important}
</style>
</head>
<body class="bg-dark-bg text-theme-text">

<header class="glass border-b border-dark-border sticky top-0 z-50">
  <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <a href="/planner/" class="flex items-center gap-2 group shrink-0" aria-label="Back to DWS Planner">
      <span class="w-9 h-9 rounded-lg bg-accent/20 flex items-center justify-center group-hover:bg-accent/30 transition-colors">
        <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </span>
      <span class="text-lg font-bold text-gradient hidden sm:inline">DWS Planner</span>
    </a>
    <label class="sr-only" for="lang">Language</label>
    <select id="lang" class="bg-dark-card text-theme-text text-sm rounded-md border border-dark-border px-2 py-1"></select>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 pb-40">
  <h1 class="text-2xl sm:text-3xl font-bold mb-1">Precision Parts Calculator</h1>
  <p class="text-theme-muted text-sm mb-6">Pick the buildings you want to raise and the industry levels you are moving between. Totals update as you go.</p>

  <div id="rows" class="space-y-3"></div>

  <div class="flex flex-wrap gap-2 mt-4">
    <button id="add" class="px-4 py-3 rounded-lg bg-accent text-accent-text text-sm font-semibold hover:opacity-90 transition">+ Add building</button>
    <button id="addAll" class="px-4 py-3 rounded-lg bg-dark-card border border-dark-border text-sm hover:bg-dark-card-hover transition">Add all remaining</button>
    <button id="reset" class="px-4 py-3 rounded-lg bg-dark-card border border-dark-border text-sm text-theme-muted hover:bg-dark-card-hover transition">Reset</button>
  </div>

  <section class="mt-6">
    <button id="toggleBreak" class="w-full flex items-center justify-between px-4 py-3 rounded-lg bg-dark-card border border-dark-border text-sm hover:bg-dark-card-hover transition" aria-expanded="false" aria-controls="breakdown">
      <span>Show band breakdown</span>
      <svg id="chev" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </button>
    <div id="breakdown" hidden class="mt-3 overflow-x-auto"></div>
  </section>

  <p id="meta" class="text-xs text-theme-muted mt-8"></p>
</main>

<div class="fixed bottom-0 inset-x-0 glass border-t border-dark-border">
  <div class="max-w-3xl mx-auto px-4 py-3">
    <div class="flex items-end justify-between gap-3">
      <div class="min-w-0">
        <div class="text-xs uppercase tracking-wide text-theme-muted">Total needed</div>
        <div id="total" class="text-2xl font-bold text-accent truncate">0</div>
        <div id="totalUnit" class="text-xs text-theme-muted"></div>
      </div>
      <div class="shrink-0 text-right">
        <label for="have" class="block text-xs uppercase tracking-wide text-theme-muted mb-1">I already have</label>
        <input id="have" type="text" inputmode="numeric" autocomplete="off" placeholder="0"
               class="w-28 bg-dark-card border border-dark-border rounded-md px-2 py-2 text-right text-sm">
        <div id="short" class="text-xs mt-1 text-theme-muted"></div>
      </div>
    </div>
  </div>
</div>

<script src="./calculator.js"></script>
</body>
</html>
